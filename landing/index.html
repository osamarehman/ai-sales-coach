<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Sales Coach — a coach in your ear, live on every call</title>
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta
      name="description"
      content="Real-time coaching cues while you talk, a report after every call, and a practice partner built from your real prospect. Made for the individual rep. Join the early-access waitlist."
    />
    <meta name="theme-color" content="#5b57eb" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="An AI sales coach in your ear — live, on every call" />
    <meta
      property="og:description"
      content="Live cues while you talk. A coaching report after. A practice partner built from your real prospect. For the rep, not the manager."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      // Respect the OS theme before first paint (avoids a flash of the wrong theme).
      (function () {
        try {
          if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches)
            document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
