name: desktop-release

# Cross-platform desktop build. NOTHING is built on the dev box — this matrix builds native
# installers on each OS and attaches them to a GitHub Release. Trigger by pushing a tag like
# `desktop-v0.1.0`, or run manually.
on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon only. A universal (x86_64+aarch64) build fails to link: screencapturekit's
          # build.rs compiles its Swift/ScreenCaptureKit bridge for the *host* arch only, and the
          # macos-latest runner is arm64 — so the x86_64 half has no SCK objects (ld: symbol(s) not
          # found for architecture x86_64). Intel support would need a separate macos-13 (x86_64) leg.
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            rust-targets: "aarch64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
            rust-targets: ""
          - platform: windows-latest
            args: ""
            rust-targets: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system deps (tauri v2 + audio)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev \
            libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf \
            build-essential curl wget file libssl-dev \
            libasound2-dev libpulse-dev

      - uses: oven-sh/setup-bun@v2

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "desktop/src-tauri -> target"

      # Build the web assets here (deterministic cwd) rather than via tauri.conf's beforeBuildCommand,
      # so tauri-action always finds ../ui/dist regardless of the CLI's working directory.
      - name: Build frontend
        run: |
          bun install
          bun run build
        working-directory: desktop/ui
        env:
          # Bakes the hosted backend into the bundle. Set the BACKEND_URL repository variable
          # (Settings → Secrets and variables → Actions → Variables) to something like
          # wss://api.example.com/ws. Left unset, the app falls back to the dev stub on
          # ws://localhost:8787 — fine for a dev box, but every downloader of that build gets
          # `websocket connect: Connection refused (os error 61)` when they hit Start session.
          VITE_BACKEND_URL: ${{ vars.BACKEND_URL }}

      - name: Build + release (tauri-action)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signature: signs the per-platform .sig files + latest.json so an installed app can
          # verify a downloaded update against the pubkey embedded in tauri.conf.json. Without these,
          # createUpdaterArtifacts still runs but the artifacts are unsigned and the updater rejects
          # them. Set as repo Actions secrets. Keypair made with `tauri signer generate`; the private
          # key is backed up out-of-band (never committed) — see the tauri-desktop-auto-update skill.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Apple Developer ID signing + notarization go here when ready — this is what removes the
          # macOS "app is damaged / unidentified developer" Gatekeeper prompt on first download:
          #   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
          #   APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
        with:
          projectPath: desktop
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('desktop-v{0}', github.run_number) }}
          releaseName: "AI Sales Coach Desktop ${{ github.ref_type == 'tag' && github.ref_name || github.run_number }}"
          releaseBody: "Automated cross-platform build. See PROTOCOL.md for the backend contract."
          # Publish immediately as the "latest" release (not draft, not prerelease). The updater
          # endpoint is .../releases/latest/download/latest.json, and GitHub's "latest" EXCLUDES
          # drafts and prereleases — so a draft/prerelease build would be invisible to installed apps
          # looking for an update. This also fixes the "I can't see the release" draft-visibility issue.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
