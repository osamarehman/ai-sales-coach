name: mobile-build

# Experimental Android + iOS builds of the Tauri app. NOTHING is built on the dev box — these jobs
# build on GitHub runners. Trigger by pushing a `mobile-v*` tag or running manually. These produce
# UNSIGNED / dev artifacts only; store-ready signing needs the secrets noted inside each job.
#
# Mobile capability note: mobile is MIC-ONLY. iOS has no public API to capture another app's or the
# system's audio, and Android's AudioPlaybackCapture cannot capture VOICE_COMMUNICATION (call)
# audio. So the app captures the rep's microphone; the prospect/far-end stream is desktop-only.
on:
  push:
    tags:
      - "mobile-v*"
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: "26.3.11579264"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK + platform
        run: sdkmanager "ndk;${NDK_VERSION}" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Export NDK_HOME
        run: echo "NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - uses: oven-sh/setup-bun@v2

      - name: Rust toolchain (+ Android targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "desktop/src-tauri -> target"

      - name: Install frontend deps + build
        working-directory: desktop/ui
        run: |
          bun install
          bun run build

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0" --locked

      - name: Tauri Android init
        working-directory: desktop
        run: cargo tauri android init

      - name: Build Android APK (debug, aarch64)
        working-directory: desktop
        run: cargo tauri android build --debug --apk --target aarch64
        # Release AAB for the Play Store needs a signing keystore wired into gen/android:
        #   ANDROID_KEY_BASE64, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: desktop/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Rust toolchain (+ iOS targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "desktop/src-tauri -> target"

      - name: Install frontend deps + build
        working-directory: desktop/ui
        run: |
          bun install
          bun run build

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0" --locked

      # Hard compile gate: does the whole Rust app (tauri + bridge + cpal mic via CoreAudio) build
      # for a real iOS device arch? generate_context! embeds ../ui/dist, so the build above runs first.
      - name: Compile Rust lib for iOS (device arch)
        working-directory: desktop/src-tauri
        run: cargo build --lib --target aarch64-apple-ios

      - name: Tauri iOS init
        working-directory: desktop
        run: cargo tauri ios init

      # Simulator build needs no code signing — validates the full Xcode packaging path. A signed
      # device .ipa needs Apple credentials (APPLE_DEVELOPMENT_TEAM, APPLE_CERTIFICATE,
      # APPLE_CERTIFICATE_PASSWORD, provisioning profile); best-effort until those secrets are set.
      - name: Build iOS app (simulator, unsigned)
        working-directory: desktop
        run: cargo tauri ios build --target aarch64-sim
        continue-on-error: true
