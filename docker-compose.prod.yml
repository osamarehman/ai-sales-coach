# Production overlay. Bring the stack up with BOTH files (NOT the dev override):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Only Caddy is published (80/443, TLS). db / backend / frontend have no host ports —
# they talk over the internal compose network. Requires in .env:
#   PUBLIC_DOMAIN, ACME_EMAIL, PUBLIC_APP_URL=https://<domain>, PUBLIC_API_URL=https://<domain>
services:
  db:
    restart: unless-stopped

  backend:
    # Baked image, no bind-mount, no file watcher. Runs migrations then serves.
    command: ["bun", "run", "start"]
    environment:
      NODE_ENV: production
      # Trust Caddy's X-Forwarded-For so the rate limiter sees real client IPs.
      TRUST_PROXY: "1"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        # Inlined into the client bundle at build time (client-safe project token).
        VITE_POSTHOG_KEY: ${POSTHOG_PROJECT_TOKEN:-${POSTHOG_KEY:-}}
        VITE_POSTHOG_HOST: ${POSTHOG_HOST:-https://us.i.posthog.com}
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    depends_on:
      - backend
      - frontend
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # certs + ACME account — persist so renewals survive restarts
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
