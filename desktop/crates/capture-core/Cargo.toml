[package]
name = "capture-core"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
ws-protocol = { path = "../ws-protocol" }
cpal = "0.15"

# System-output (loopback) capture is platform-specific — one `AudioCapture` impl per OS,
# each behind a `cfg(target_os)` gate so only the current target's backend compiles.

# Linux: record the default sink's monitor source over the PulseAudio protocol (works on both
# classic PulseAudio and PipeWire's pulse shim). The blocking "simple" API fits a capture thread.
[target.'cfg(target_os = "linux")'.dependencies]
libpulse-binding = "2"
libpulse-simple-binding = "2"

# Windows: WASAPI shared-mode loopback capture of the default render endpoint.
[target.'cfg(target_os = "windows")'.dependencies]
wasapi = "0.23"

# macOS: ScreenCaptureKit system-audio capture via the `ruhear` wrapper — it owns the
# SCStream + CMSampleBuffer→f32 extraction. Requires the Screen Recording permission at runtime.
[target.'cfg(target_os = "macos")'.dependencies]
ruhear = "0.1"
# Hold ScreenCaptureKit at 1.4.x: ruhear 0.1.1 calls SCContentFilter::builder(), which 1.5 renamed
# to create(), so ruhear's own loose `^1.4` resolving to 1.5.x fails to compile (it did in CI). No
# newer ruhear exists (0.1.1 is latest), so pin the SCK API it was written against.
screencapturekit = ">=1.4, <1.5"
