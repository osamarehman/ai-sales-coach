<!-- @dsCard group="Screens" name="Sign up" subtitle="Auth — creates tenant + owner (login variant noted)" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign up — AI Sales Coach</title>
<link rel="stylesheet" href="../styles.css">
</head>
<body>
<div class="center-wrap">
  <div class="auth-card">
    <div class="row" style="gap:10px; margin-bottom:22px; justify-content:center">
      <span style="width:28px;height:28px;border-radius:8px;background:var(--primary);display:inline-block"></span>
      <b style="font-size:16px">Sales Coach</b>
    </div>

    <div class="card pad">
      <h1 style="font-size:19px; text-align:center">Create your workspace</h1>
      <p class="muted" style="text-align:center; margin:6px 0 20px">Grade every sales call against the H.E.A.R.T. rubric.</p>

      <div class="field"><label>Organization name</label><div class="input placeholder">Acme Sales</div></div>
      <div class="field"><label>Work email</label><div class="input placeholder">you@company.com</div></div>
      <div class="field"><label>Password</label><div class="input placeholder">8+ characters</div>
        <span class="hint">Signing up creates your organization — you'll be the owner.</span></div>

      <button class="btn primary" style="width:100%; justify-content:center; height:40px; margin:6px 0 14px">Create workspace</button>
      <p class="muted" style="text-align:center; font-size:13px">Already have an account? <b style="color:var(--ink)">Log in</b></p>
    </div>

    <p class="faint" style="text-align:center; font-size:12px; margin-top:16px">
      Log in variant = email + password only, same card.
    </p>
  </div>
</div>
</body>
</html>
